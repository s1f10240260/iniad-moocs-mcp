# D1 の中身を確認する手動実行用ワークフロー
# Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_DATABASE_ID

name: d1-smoke

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "実行する SELECT（1 文、read-only 想定）"
        required: true
        default: "SELECT count(*) AS courses FROM courses"

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install wrangler
        working-directory: workers
        run: npm ci

      - name: Query D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          D1_SQL: ${{ github.event.inputs.sql }}
        run: |
          node workers/scripts/patch-d1-id.cjs
          cd workers
          echo "== $D1_SQL"
          npx wrangler d1 execute moocs-mcp --remote --command "$D1_SQL"
