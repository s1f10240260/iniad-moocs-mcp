# 毎日 0:00 UTC に Moocs からデータ収集
# 設計: ../../DESIGN.md 「運用設定」
#
# Secrets:
#   MOOCS_USERNAME / MOOCS_PASSWORD — ログイン（Secrets に置き平文ログに出さない）
#   CLOUDFLARE_API_TOKEN  — R2 / D1 更新用
#   CLOUDFLARE_ACCOUNT_ID
#
# 初回は course に CODE を指定して 1 コース分だけ流す（contents は 100 回/日制限あり）

name: collect-moocs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "対象年度"
        required: true
        default: "2026"
      course:
        description: "コース CODE（カンマ区切り可）。空なら --all"
        required: false
        default: ""
      skip_contents:
        description: "skip contents collect (rate limit)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: collect-moocs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: collector/slides

      - name: Build collect-headless
        working-directory: collector/slides
        run: cargo build --release

      - name: Collect slides (non-interactive)
        env:
          MOOCS_USERNAME: ${{ secrets.MOOCS_USERNAME }}
          MOOCS_PASSWORD: ${{ secrets.MOOCS_PASSWORD }}
        run: |
          YEAR="${{ github.event.inputs.year || '2026' }}"
          COURSE="${{ github.event.inputs.course }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$COURSE" ]; then
            COURSE="INI201,INI202"
          fi
          BIN=./collector/slides/target/release/collect-headless
          if [ -n "$COURSE" ]; then
            : > collect-slides.jsonl
            IFS=',' read -ra LIST <<< "$COURSE"
            for c in "${LIST[@]}"; do
              code="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$code" ] && continue
              echo "== collect slides $code"
              "$BIN" --year "$YEAR" --path ./out --course "$code" --json --retries 3 | tee -a collect-slides.jsonl
            done
          else
            "$BIN" --year "$YEAR" --path ./out --all --json --retries 3 | tee collect-slides.jsonl
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contents-collector
        working-directory: collector/contents
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Empty contents jsonl when skipped
        if: ${{ github.event.inputs.skip_contents == 'true' }}
        run: touch collect-contents.jsonl

      - name: Collect quizzes & assignments
        if: ${{ github.event.inputs.skip_contents != 'true' }}
        env:
          MOOCS_USERNAME: ${{ secrets.MOOCS_USERNAME }}
          MOOCS_PASSWORD: ${{ secrets.MOOCS_PASSWORD }}
        run: |
          YEAR="${{ github.event.inputs.year || '2026' }}"
          COURSE="${{ github.event.inputs.course }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$COURSE" ]; then
            COURSE="INI201,INI202"
          fi
          if [ -n "$COURSE" ]; then
            : > collect-contents.jsonl
            IFS=',' read -ra LIST <<< "$COURSE"
            for c in "${LIST[@]}"; do
              code="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$code" ] && continue
              echo "== collect contents $code"
              contents-collector --year "$YEAR" --path ./out --course "$code" --json | tee -a collect-contents.jsonl
            done
          else
            contents-collector --year "$YEAR" --path ./out --all --json | tee collect-contents.jsonl
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moocs-collect-${{ github.run_id }}
          path: |
            out/
            collect-*.jsonl
          retention-days: 7

      # Phase 5: ingest to R2 / D1 (skip when CLOUDFLARE secrets are absent)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install ingest deps
        working-directory: workers
        run: npm ci

      - name: Ingest to D1 / R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_* secrets not set -- skip D1/R2, artifact only"
            exit 0
          fi
          node workers/scripts/patch-d1-id.cjs
          cd workers
          npm run db:remote
          npm run ingest -- \
            --out ../out \
            --jsonl ../collect-slides.jsonl \
            --jsonl ../collect-contents.jsonl \
            --remote \
            --retries 3
