# 毎日 0:00 UTC に Moocs からデータ収集
# 設計: ../../DESIGN.md 「運用設定」
#
# Secrets:
#   MOOCS_USERNAME / MOOCS_PASSWORD — ログイン（Secrets に置き平文ログに出さない）
#   CLOUDFLARE_API_TOKEN  — R2 / D1 更新用
#   CLOUDFLARE_ACCOUNT_ID
#
# 初回は course に CODE を指定して 1 コース分だけ流す（contents は 100 回/日制限あり）

name: collect-moocs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "対象年度"
        required: true
        default: "2026"
      course:
        description: "コース CODE（空なら --all）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: collect-moocs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: collector/slides

      - name: Build collect-headless
        working-directory: collector/slides
        run: cargo build --release

      - name: Collect slides (non-interactive)
        env:
          MOOCS_USERNAME: ${{ secrets.MOOCS_USERNAME }}
          MOOCS_PASSWORD: ${{ secrets.MOOCS_PASSWORD }}
        run: |
          YEAR="${{ github.event.inputs.year || '2026' }}"
          COURSE="${{ github.event.inputs.course }}"
          if [ -n "$COURSE" ]; then
            ./collector/slides/target/release/collect-headless \
              --year "$YEAR" --path ./out --course "$COURSE" --json --retries 3 | tee collect-slides.jsonl
          else
            ./collector/slides/target/release/collect-headless \
              --year "$YEAR" --path ./out --all --json --retries 3 | tee collect-slides.jsonl
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contents-collector
        working-directory: collector/contents
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Collect quizzes & assignments
        env:
          MOOCS_USERNAME: ${{ secrets.MOOCS_USERNAME }}
          MOOCS_PASSWORD: ${{ secrets.MOOCS_PASSWORD }}
        run: |
          YEAR="${{ github.event.inputs.year || '2026' }}"
          COURSE="${{ github.event.inputs.course }}"
          if [ -n "$COURSE" ]; then
            contents-collector --year "$YEAR" --path ./out --course "$COURSE" --json | tee collect-contents.jsonl
          else
            contents-collector --year "$YEAR" --path ./out --all --json | tee collect-contents.jsonl
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moocs-collect-${{ github.run_id }}
          path: |
            out/
            collect-*.jsonl
          retention-days: 7

