[project]
name = "contents-collector"
version = "0.1.0"
description = "Moocs quizzes & assignments collector (headless, for GitHub Actions)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
contents-collector = "contents_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contents_collector"]
