[package]
name = "collect-headless"
version = "0.1.0"
edition = "2021"
description = "Non-interactive headless wrapper around moocs-collect for CI batch collection"
license = "MIT"

# 公式 CLI ではなくコアライブラリを直接使う
# 破壊的変更に備えて rev でピン留めする
[dependencies]
collect = { git = "https://github.com/yu7400ki/moocs-collect.git", rev = "2ed9a33e89ba405b7db33001b03ff4d653b5fe09", package = "collect" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["cookies", "gzip"] }
lopdf = "0.35"
futures = "0.3"

[profile.release]
lto = true
